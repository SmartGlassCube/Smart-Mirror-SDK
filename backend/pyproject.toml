[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smartmirror"
version = "0.1.0"
description = "Local-first smart mirror OS with WebSocket-driven UI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

authors = [
  { name = "Moetez Fradi", email = "moetezfradi7@gmail.com" }
]

dependencies = [
  "mediapipe>=0.10.0",
  "opencv-python>=4.8.0",
  "websockets>=12.0",
  "numpy>=1.24.0"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "black",
  "mypy",
  "ruff",
  "pytest-asyncio>=1.2.0",
]
data = [
  "pymongo>=4.7.0",
  "python-dotenv>=1.0",
  # zoneinfo has no time-zone database of its own on Windows
  "tzdata; sys_platform == 'win32'",
]
assistant = [
  "openai>=1.0.0",
  "anthropic>=0.30.0",
  "qdrant-client>=1.9.0",
  "sentence-transformers>=3.0.0",
  "sounddevice>=0.4.6",
  "pywhispercpp>=1.2.0",
  "piper-tts>=1.2.0"
]

# Same list as the `dev` extra: uv syncs dependency groups by default (so plain
# `uv run pytest` uses .venv's pytest), the extra is for `pip install -e ".[dev]"`.
# Keep the two in sync.
[dependency-groups]
dev = [
  "pytest",
  "black",
  "mypy",
  "ruff",
  "pytest-asyncio>=1.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["smartmirror*"]

[tool.setuptools.package-data]
smartmirror = [
  "config/json_config/*.json",
  "assistant/rag/seed_corpus/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
