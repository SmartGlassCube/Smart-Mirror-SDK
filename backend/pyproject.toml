[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smartmirror"
dynamic = ["version"]  # smartmirror/__init__.py: __version__
description = "Build gesture-controlled smart mirrors: webcam hand gestures drive pages and widgets of a React UI, plus a voice assistant"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["smart mirror", "gesture recognition", "hand tracking", "mediapipe", "computer vision", "voice assistant", "websocket"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video :: Capture",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Home Automation",
]

authors = [
  { name = "Moetez Fradi", email = "moetezfradi7@gmail.com" }
]

dependencies = [
  "mediapipe>=0.10.0",
  "opencv-python>=4.8.0",
  "websockets>=14.0",
  "numpy>=1.24.0"
]

[project.urls]
Homepage = "https://github.com/SmartGlassCube/Smart-Mirror-SDK"
Documentation = "https://github.com/SmartGlassCube/Smart-Mirror-SDK/tree/main/docs"
Repository = "https://github.com/SmartGlassCube/Smart-Mirror-SDK"
Issues = "https://github.com/SmartGlassCube/Smart-Mirror-SDK/issues"

[project.scripts]
smartmirror = "smartmirror.app.main:main"

[project.optional-dependencies]
dev = [
  "pytest",
  "black",
  "mypy",
  "ruff",
  "pytest-asyncio>=1.2.0",
]
data = [
  "pymongo>=4.7.0",
  "python-dotenv>=1.0",
  # zoneinfo has no time-zone database of its own on Windows
  "tzdata; sys_platform == 'win32'",
]
assistant = [
  "openai>=1.0.0",
  "anthropic>=0.30.0",
  "qdrant-client>=1.9.0",
  "sentence-transformers>=3.0.0",
  "sounddevice>=0.4.6",
  "pywhispercpp>=1.2.0",
  "piper-tts>=1.2.0"
]

# Same list as the `dev` extra: uv syncs dependency groups by default (so plain
# `uv run pytest` uses .venv's pytest), the extra is for `pip install -e ".[dev]"`.
# Keep the two in sync.
[dependency-groups]
dev = [
  "pytest",
  "black",
  "mypy",
  "ruff",
  "pytest-asyncio>=1.2.0",
]

[tool.setuptools.dynamic]
version = { attr = "smartmirror.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["smartmirror*"]

[tool.setuptools.package-data]
smartmirror = [
  "config/json_config/*.json",
  "assistant/rag/seed_corpus/*",
  # The prebuilt UI: scripts/build_frontend.py, run before building the package
  "ui/*",
  "ui/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
