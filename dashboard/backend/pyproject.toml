[project]
name = "smartmirror-dashboard-backend"
version = "0.1.0"
description = "Exec-board dashboard API: content CRUD + mirror monitoring"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pymongo>=4.7.0",
  "bcrypt>=4.1.0",
  "pyjwt>=2.9.0",
  "langdetect>=1.0.9",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
