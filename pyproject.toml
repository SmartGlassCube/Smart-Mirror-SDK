[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smartmirror"
version = "0.1.0"
description = "Local-first smart mirror OS with WebSocket-driven UI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

authors = [
  { name = "Moetez Fradi", email = "moetezfradi7@gmail.com" }
]

dependencies = [
  "mediapipe>=0.10.0",
  "opencv-python>=4.8.0",
  "websockets>=12.0",
  "numpy>=1.24.0"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "black",
  "mypy",
  "ruff",
  "pytest-asyncio>=1.2.0",
]
data = [
  "pymongo>=4.7.0",
  "python-dotenv>=1.0",
]
assistant = [
  "openai>=1.0.0",
  "anthropic>=0.30.0",
  "qdrant-client>=1.9.0",
  "sentence-transformers>=3.0.0",
  "sounddevice>=0.4.6",
  "pywhispercpp>=1.2.0",
  "piper-tts>=1.2.0"
]

# uv-native equivalent of the `dev` extra above -- `[dependency-groups]`
# (unlike `[project.optional-dependencies]`) is synced by `uv run`/`uv sync`
# by default, with no --extra flag needed. This is what makes plain
# `uv run pytest` reliably use .venv's pytest instead of silently falling
# back to whatever `pytest` happens to be on $PATH. Keep both tables in
# sync: `[project.optional-dependencies].dev` still exists for plain
# `pip install -e ".[dev]"` users.
[dependency-groups]
dev = [
  "pytest",
  "black",
  "mypy",
  "ruff",
  "pytest-asyncio>=1.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["smartmirror*"]

[tool.setuptools.package-data]
smartmirror = [
  "config/json_config/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
