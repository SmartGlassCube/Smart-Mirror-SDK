[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smartmirror"
version = "0.1.0"
description = "Local-first smart mirror OS with WebSocket-driven UI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

authors = [
  { name = "Moetez Fradi", email = "moetezfradi7@gmail.com" }
]

dependencies = [
  "mediapipe>=0.10.0",
  "opencv-python>=4.8.0",
  "websockets>=12.0",
  "numpy>=1.24.0"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "black",
  "mypy",
  "ruff"
]
data = [
  "pymongo>=4.7.0",
  "python-dotenv>=1.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["smartmirror*"]

[tool.setuptools.package-data]
smartmirror = [
  "config/json_config/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]