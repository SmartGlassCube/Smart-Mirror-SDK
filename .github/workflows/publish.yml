# Publishes backend/ to PyPI as `glasscube` when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag must match __version__ in backend/glasscube/__init__.py.
#
# Uses PyPI trusted publishing (no token stored here). One-time setup on pypi.org:
# Account -> Publishing -> Add a pending publisher -> GitHub, with
#   project name: glasscube, owner: SmartGlassCube, repository: Smart-Mirror-SDK,
#   workflow: publish.yml, environment: pypi
name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # builds and checks only; publishing needs a tag

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(uv run --no-project python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('glasscube/__init__.py').read()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match __version__ $version"; exit 1
          fi

      - name: Tests (no camera, no assistant extra)
        run: uv run pytest tests/core tests/vision tests/widgets tests/server tests/hal -q

      - name: Bundle the mirror UI into the package
        run: uv run python scripts/build_frontend.py

      - name: Build sdist and wheel
        run: uv build

      - name: Check the dists
        run: |
          uvx twine check --strict dist/*
          unzip -l dist/*.whl | grep -q "glasscube/ui/index.html" || { echo "The wheel has no bundled UI"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: backend/dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/glasscube/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
